<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Star Catcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --gold:#ffd84a; --pink:#ff5fa2; --ink:#0b0826; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ink); overflow: hidden; touch-action: none; }
  body { font-family: 'Fredoka', system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 20px; pointer-events: none; font-weight: 700; }
  #hud .score { font-size: 34px; color: var(--gold); text-shadow: 0 0 18px rgba(255,216,74,.6); }
  #hud .sub { font-size: 14px; opacity: .75; font-weight: 500; letter-spacing: .05em; }
  #lives { font-size: 26px; letter-spacing: 4px; color: var(--pink); text-shadow: 0 0 12px rgba(255,95,162,.7); }
  #combo { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; color: #8ff7ff; text-shadow: 0 0 14px #3fe0ff; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; background: radial-gradient(ellipse at center, rgba(40,20,90,.55), rgba(11,8,38,.92)); padding: 24px; }
  .hidden { display: none !important; }
  h1 { font-size: clamp(48px, 11vw, 104px); line-height: .95; background: linear-gradient(180deg, #fff6c2, var(--gold) 50%, #ff9d3c); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 24px rgba(255,200,60,.45)); }
  .screen p { max-width: 440px; opacity: .85; font-size: 17px; line-height: 1.5; font-weight: 500; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; font-size: 15px; opacity: .9; }
  .legend span b { font-size: 20px; margin-right: 4px; }
  button { font-family: inherit; font-size: 22px; font-weight: 700; padding: 14px 44px; border: 0; border-radius: 999px; cursor: pointer; color: var(--ink); background: linear-gradient(180deg, #fff3a8, var(--gold)); box-shadow: 0 6px 0 #c9931a, 0 0 30px rgba(255,216,74,.5); transition: transform .1s; }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c9931a; }
  .best { color: var(--gold); font-size: 18px; }
  .final { font-size: 64px; color: var(--gold); font-weight: 700; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div><div class="score" id="score">0</div><div class="sub" id="level">LEVEL 1</div></div>
  <div id="lives"></div>
</div>
<div id="combo"></div>

<div class="screen" id="start">
  <h1>Star<br/>Catcher</h1>
  <p>Glide your little moon jar across the night sky. Catch falling stars, chain catches for combos, and dodge the meteors.</p>
  <div class="legend">
    <span><b style="color:#ffd84a">★</b>+10</span>
    <span><b style="color:#8ff7ff">★</b>+50 rare</span>
    <span><b style="color:#ff5fa2">♥</b>extra life</span>
    <span><b style="color:#b28cff">◎</b>magnet</span>
    <span><b style="color:#ff6a3d">●</b>meteor!</span>
  </div>
  <button id="play">Play</button>
  <div class="best" id="bestStart"></div>
  <p style="font-size:14px;opacity:.6">Mouse / touch to move · or ← → / A D · P to pause</p>
</div>

<div class="screen hidden" id="over">
  <h1 style="font-size:clamp(40px,8vw,76px)">Sky's Dark</h1>
  <div class="final" id="final">0</div>
  <div class="best" id="bestOver"></div>
  <button id="again">Play Again</button>
</div>

<div class="screen hidden" id="paused">
  <h1 style="font-size:clamp(40px,8vw,76px)">Paused</h1>
  <button id="resume">Resume</button>
</div>

<script src="game.js"></script>
</body>
</html>
