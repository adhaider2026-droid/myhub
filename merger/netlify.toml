# إعدادات Netlify لخدمة دمج الفيديوهات — تُنشر كموقع منفصل من نفس المستودع
# مع ضبط Base Directory = merger في إعدادات الموقع على لوحة Netlify.
# المزيد في merger/README.md ← قسم «النشر على Netlify خطوة بخطوة».

[build]
  publish = "public"          # واجهة عربية RTL ثابتة (public/index.html)
  # تثبيت صريح للمكتبات — بدونه تُترك external_node_modules بلا node_modules وقت التشغيل
  # ويفشل التشغيل بخطأ Cannot find module '@libsql/client'
  command = "npm install --no-audit --no-fund --loglevel=error"

[functions]
  # esbuild يجمع الدوال؛ المكتبات ذات الثنائيات تُترك خارجية (require وقت التشغيل)
  node_bundler = "esbuild"
  # ffmpeg-static وffprobe-static يحملان ثنائيات ffmpeg — يجب استبعادها من التجميع
  # كي يبقى مسار __dirname صحيحًا. @libsql/client استُبدل بشيم HTTP خالص داخل lib/libsql-http.js
  external_node_modules = ["ffmpeg-static", "ffprobe-static"]

# ثنائيات ffmpeg تُشحن فقط لدالة المعالجة الخلفية (حتى 250MB) — باقي الدوال تبقى خفيفة
# ffmpeg-static/ffprobe-static يتركان خارج التجميع (external) وتُنسخ ملفاتهما داخل الحزمة بمساراتها
[functions.api-job-process]
  included_files = [
    "node_modules/ffmpeg-static/**",
    "node_modules/ffprobe-static/index.js",
    "node_modules/ffprobe-static/package.json",
    "node_modules/ffprobe-static/bin/linux/x64/ffprobe",
  ]

# الدالة الخلفية للدمج (حتى 15 دقيقة) مضبوطة داخل ملفها نفسه:
# netlify/functions/api-job-process.mjs ← config = { path, background: true }
# والتنظيف اليومي المجدول في netlify/functions/cron-cleanup.mjs ← config.schedule

# ملاحظة الحدود على Netlify:
# - الدوال المتزامنة: 60 ثانية (التكوين/الرفع/الحالة/البث كلها سريعة)
# - الدالة الخلفية (process): حتى 15 دقيقة — متاحة في الخطة المجانية
# - حجم طلب الدالة ~6MB → أجزاء الرفع 4MB متوافقة تمامًا
